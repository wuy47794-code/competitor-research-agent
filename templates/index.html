<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞品调研 Agent</title>
<style>
  :root{ --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --accent:#4f46e5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.7;}
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px;}
  header h1{font-size:26px;margin:0 0 6px;}
  header p{color:var(--muted);margin:0 0 24px;font-size:15px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04);}

  .form{display:flex;gap:12px;flex-wrap:wrap;}
  input[type=text]{flex:1 1 260px;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  button{font-size:16px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;
    padding:12px 24px;cursor:pointer;}
  button:disabled{background:#9ca3af;cursor:not-allowed;}
  .hint{color:var(--muted);font-size:13px;margin-top:10px;}

  #status{margin-top:20px;display:none;align-items:center;gap:12px;color:var(--muted);}
  .spinner{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #error{display:none;margin-top:20px;padding:14px 16px;border:1px solid #fca5a5;background:#fef2f2;
    color:#b91c1c;border-radius:10px;font-size:14px;}

  #result{display:none;margin-top:24px;}
  .report{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 32px;}
  .report h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:12px;}
  .report h2{font-size:18px;margin-top:26px;}
  .report h3{font-size:16px;margin-top:20px;}
  .report blockquote{color:var(--muted);border-left:4px solid var(--line);margin:12px 0;padding:4px 16px;}
  .report li{margin:4px 0;}
  .report code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:13px;}
  .report table{border-collapse:collapse;width:100%;margin:12px 0;}
  .report th,.report td{border:1px solid var(--line);padding:8px 12px;text-align:left;font-size:14px;}
  .report a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 竞品调研 Agent</h1>
    <p>输入一个竞品 / 公司名，Agent 自动浏览官网与多个网页，生成结构化调研报告。</p>
  </header>

  <div class="card">
    <div class="form">
      <input type="text" id="name" placeholder="例如：Dify、RAGFlow、字节跳动……" />
      <button id="btn" onclick="startResearch()">开始调研</button>
    </div>
    <div class="hint">Agent 会打开一个浏览器窗口自动操作，全程约 1~3 分钟，请耐心等待。</div>
  </div>

  <div id="status">
    <div class="spinner"></div>
    <span>Agent 正在浏览网页、收集信息并生成报告，请稍候……</span>
  </div>

  <div id="error"></div>

  <div id="result">
    <div class="report" id="report-body"></div>
  </div>
</div>

<script>
  function setLoading(on){
    document.getElementById('status').style.display = on ? 'flex' : 'none';
    document.getElementById('btn').disabled = on;
    document.getElementById('error').style.display = 'none';
  }
  function showError(msg){
    const e = document.getElementById('error');
    e.textContent = msg;
    e.style.display = 'block';
  }
  async function startResearch(){
    const name = document.getElementById('name').value.trim();
    if(!name){ showError('请输入竞品名称'); return; }
    setLoading(true);
    try{
      const resp = await fetch('/api/research', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name})
      });
      const data = await resp.json();
      if(data.ok){
        document.getElementById('report-body').innerHTML = data.html;
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').scrollIntoView({behavior:'smooth'});
      } else {
        showError(data.error || '调研失败');
      }
    } catch(e){
      showError('请求失败：' + e.message);
    } finally {
      setLoading(false);
    }
  }
</script>
</body>
</html>
